name: Convert org to qmd

on:
  push:
    branches:
      - main
    paths:
      - "articles_original_org/*.org"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install diagram tools (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz groff ditaa

      - name: Install mermaid-cli, d2
        run: |
          npm install -g @mermaid-js/mermaid-cli
          # d2: get latest version from API, then download
          D2_URL=$(curl -sL https://api.github.com/repos/d2lang/d2/releases/latest | grep '"browser_download_url"' | grep 'linux-amd64.tar.gz' | head -1 | cut -d'"' -f4)
          curl -sSL "$D2_URL" | tar -xz -C /usr/local/bin

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'

      - name: Convert org files to qmd
        run: |
          find articles_original_org -name "*.org" | while read f; do
            base=$(basename "$f" .org)
            quarto pandoc "$f" \
              --from org \
              --to markdown+yaml_metadata_block \
              --standalone \
              -o "articles/${base}.qmd"
            sed -i -E 's/^``` ?(ojs|python|r|julia|mermaid|d2|dot|pic|ditaa)$/```{\1}/' \
              "articles/${base}.qmd"
            # org TODO/DONE keywords: drop pandoc span markup, keep heading text
            sed -i -E 's/\[(DONE|TODO)\]\{\.[a-z]+ \.[A-Z]+\} ?//' "articles/${base}.qmd"
            # pikchr: no Quarto extension; wrap as R chunk calling pikchr()
            awk '
              function wrap_ojs(  i, l, first) {
                for (i = 1; i <= nb; i++) if (body[i] ~ /^\/\/\|/) print body[i]
                first = ""
                for (i = 1; i <= nb && first == ""; i++)
                  if (body[i] !~ /^\/\/\|/ && body[i] !~ /^[ \t]*$/) first = body[i]
                if (first == "{") {
                  for (i = 1; i <= nb; i++) if (body[i] !~ /^\/\/\|/) print body[i]
                  return
                }
                print "{"
                for (i = 1; i <= nb; i++) {
                  l = body[i]
                  if (l ~ /^\/\/\|/) continue
                  if (l ~ /^[A-Za-z_][A-Za-z0-9_]* = /) l = "const " l
                  else if (l ~ /^Plot\./) l = "return " l
                  else if (l ~ /^\]$/) l = "];"
                  print l
                }
                print "}"
              }
              /^``` \{.*\.pikchr\}$/ || /^```\{pikchr\}$/ { print "```{r}"; print "#| echo: false"; print "library(pikchr)"; print "pikchr(r\"---("; inblk=1; next }
              inblk && /^```$/ { print ")---\")"; print "```"; inblk=0; next }
              /^```\{ojs\}$/ { print; print "//| echo: false"; inojs=1; nb=0; next }
              inojs && /^```$/ { inojs=0; wrap_ojs(); next }
              inojs { body[++nb]=$0; next }
              { print }
            ' "articles/${base}.qmd" > "articles/${base}.tmp" && mv "articles/${base}.tmp" "articles/${base}.qmd"
            if [ -f "articles_original_org/${base}.css" ]; then
              cp "articles_original_org/${base}.css" "articles/${base}.css"
              css_file="${base}.css"
            else
              css_file="styles.css"
            fi
            sed -i "2i css: ${css_file}" "articles/${base}.qmd"
            echo "Converted: $f -> articles/${base}.qmd (css: ${css_file})"
          done

      - name: Debug pikchr output
        run: |
          grep -n -A2 pikchr articles/*.qmd || echo "no pikchr lines"

      - name: Commit converted qmd files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"
          git add articles/*.qmd articles/*.css 2>/dev/null || git add articles/*.qmd
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: convert org sources to qmd"
            git push
          fi