name: Install Quarto Extensions

# Installs Quarto extensions to a neutral path so they can be cached
# and copied into any repo's _extensions/ before rendering.
# quarto-ext/pikchr: renders fenced pikchr blocks using the pikchr binary.
# mcanouil/quarto-d2:  renders fenced d2 blocks using the D2 binary.
# Reusable — call from any workflow that needs these extensions.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'

      - name: Cache Quarto extensions
        id: cache-exts
        uses: actions/cache@v4
        with:
          path: /opt/tools/quarto-extensions
          key: quarto-extensions-pikchr-d2-${{ runner.os }}-v1

      - name: Install Quarto extensions
        if: steps.cache-exts.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/tools/quarto-extensions
          cd /opt/tools/quarto-extensions
          printf 'project:\n  type: default\n' > _quarto.yml
          quarto add --no-prompt quarto-ext/pikchr
          quarto add --no-prompt mcanouil/quarto-d2

      - name: Verify extensions
        run: ls /opt/tools/quarto-extensions/_extensions/
