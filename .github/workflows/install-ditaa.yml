name: Install ditaa

# Installs ditaa ASCII-art-to-PNG converter from Ubuntu 24.04 universe repo.
# ditaa is a Java JAR; Java is pre-installed on ubuntu-latest.
# Caches the JAR; a launcher wrapper is written at runtime (not cached).
# Reusable — call from any workflow that needs ditaa on PATH.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Cache ditaa JAR
        id: cache-ditaa
        uses: actions/cache@v4
        with:
          path: /opt/tools/ditaa/ditaa.jar
          key: ditaa-${{ runner.os }}-v1

      - name: Install ditaa
        if: steps.cache-ditaa.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ditaa
          mkdir -p /opt/tools/ditaa
          JAR=$(find /usr/share -name "ditaa*.jar" 2>/dev/null | head -1)
          cp "$JAR" /opt/tools/ditaa/ditaa.jar

      - name: Write ditaa launcher
        run: |
          mkdir -p /opt/tools/bin
          printf '#!/bin/sh\nexec java -jar /opt/tools/ditaa/ditaa.jar "$@"\n' \
            > /opt/tools/bin/ditaa
          chmod +x /opt/tools/bin/ditaa

      - name: Verify ditaa
        run: /opt/tools/bin/ditaa --version || true

      - name: Add to PATH
        run: echo "/opt/tools/bin" >> "$GITHUB_PATH"
