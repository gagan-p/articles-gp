name: Render and Deploy Quarto Site

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - "Convert org to qmd"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  render-and-deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up subsequent runs drastically

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter matplotlib pandas numpy

      # NOTE: Re-add the R setup step here ONLY if you explicitly use R code blocks (.Rmd / r code cells)
      # Otherwise, keeping it omitted cuts your build time down to under 60 seconds.

      - name: Render Quarto Project
        run: |
          quarto render --output-dir publish-final # Explicitly forces output into the deployment folder

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4 # Upgraded to v4 for faster node execution
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish-final
          publish_branch: gh-pages
          force_orphan: true
