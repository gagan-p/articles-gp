name: Render and Deploy Quarto Site

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - "Convert org to qmd"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  install:
    uses: ./.github/workflows/install-deps.yml
    secrets: inherit

  render-and-deploy:
    runs-on: ubuntu-latest
    needs: install
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore pikchr
        uses: actions/cache@v4
        with:
          path: /opt/tools/bin/pikchr
          key: pikchr-${{ runner.os }}-v1

      - name: Restore D2
        uses: actions/cache@v4
        with:
          path: /opt/tools/bin/d2
          key: d2-${{ runner.os }}-v1

      - name: Restore Graphviz
        uses: actions/cache@v4
        with:
          path: |
            /opt/tools/bin/dot
            /opt/tools/bin/neato
            /opt/tools/bin/fdp
            /opt/tools/bin/sfdp
            /opt/tools/bin/twopi
            /opt/tools/bin/circo
          key: graphviz-${{ runner.os }}-v1

      - name: Restore ditaa JAR
        uses: actions/cache@v4
        with:
          path: /opt/tools/ditaa/ditaa.jar
          key: ditaa-${{ runner.os }}-v1

      - name: Write ditaa launcher
        run: |
          mkdir -p /opt/tools/bin
          printf '#!/bin/sh\nexec java -jar /opt/tools/ditaa/ditaa.jar "$@"\n' \
            > /opt/tools/bin/ditaa
          chmod +x /opt/tools/bin/ditaa

      - name: Restore gnuplot
        uses: actions/cache@v4
        with:
          path: /opt/tools/bin/gnuplot
          key: gnuplot-${{ runner.os }}-v1

      - name: Restore R
        uses: actions/cache@v4
        with:
          path: /opt/tools/bin/Rscript
          key: r-${{ runner.os }}-v1

      - name: Restore pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-jupyter-matplotlib-pandas-numpy-v1

      - name: Restore Quarto extensions
        uses: actions/cache@v4
        with:
          path: /opt/tools/quarto-extensions
          key: quarto-extensions-pikchr-d2-${{ runner.os }}-v1

      - name: Copy Quarto extensions into project
        run: |
          mkdir -p _extensions
          cp -r /opt/tools/quarto-extensions/_extensions/. ./_extensions/

      - name: Add tools to PATH
        run: echo "/opt/tools/bin" >> "$GITHUB_PATH"

      - name: Render Quarto Project
        run: quarto render --output-dir publish-final

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish-final
          publish_branch: gh-pages
          force_orphan: true
