name: Install Graphviz

# Installs Graphviz graph layout engine from Ubuntu 24.04 repos.
# apt install is fast (~3s); shared libs make binary-only caching unreliable.
# Reusable — call from any workflow that needs graphviz on PATH.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Verify Graphviz
        run: dot -V
